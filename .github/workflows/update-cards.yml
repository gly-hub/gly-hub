name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: gly-hub
        run: node scripts/generate-cards.mjs

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: gly-hub
          outputs: |
            generated/profile-cards/github-contribution-grid-snake.svg?palette=github-light

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/profile-cards
          git diff --cached --quiet || git commit -m "chore: update profile cards"
          git push