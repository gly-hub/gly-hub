name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: gly-hub
        run: node scripts/generate-cards.mjs

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: gly-hub
          outputs: |
            tmp/snake-light.svg?palette=github-light&color_snake=%230969da&color_dots=%23f6f8fa,%23dbeafe,%2393c5fd,%233b82f6,%231d4ed8
            tmp/snake-dark.svg?palette=github-dark&color_snake=%2358a6ff&color_dots=%2316122c,%230e4429,%2300661f,%2326a641,%2339d353

      - name: Style contribution snake
        run: node scripts/style-snake.mjs

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/profile-cards
          git diff --cached --quiet || git commit -m "chore: update profile cards"
          git push